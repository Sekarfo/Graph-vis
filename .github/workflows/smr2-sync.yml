# Графы с прода → repo, затем факт СМР из живой Google-таблицы «общий свод по
# смр СНП 2.0» → smr2/*.json.
#
# Два шага в одной джобе намеренно, и порядок важен:
#
#   1. ГРАФЫ. Источник правды по геометрии — ФРОНТ: граф правят кнопкой
#      «✏️ Правка» во вьюере, сервер пишет правку в свой DATA_DIR. Репозиторий —
#      зеркало, и его надо обновить ПЕРЕД разбором свода: у перерисованного на
#      фронте ребра ДРУГОЙ id, и факт лёг бы на старую геометрию.
#   2. ФАКТ. Свод правят каждый день, поэтому карта подтягивает его сама:
#      скачиваем таблицу (экспорт открыт по ссылке, ключи не нужны),
#      раскладываем по рёбрам уже свежего графа и коммитим всё одним коммитом —
#      Railway разворачивает новый образ по push в main.
#
# Почему экспорт живёт здесь, а не отдельной джобой: пуш, сделанный от
# GITHUB_TOKEN, НЕ запускает другие workflow. Отдельная джоба-экспортёр
# закоммитила бы regions/, но триггер `push: regions/**` ниже от её коммита не
# сработал бы — и факт остался бы привязан к старым id рёбер до следующего
# расписания. В одной джобе этой ямы нет.
#
# Расписание — дважды в сутки по времени Астаны (UTC+5): 07:10 и 19:10.
# Минуты не круглые намеренно: в :00 у GitHub пик очереди и запуск может
# задержаться на десятки минут. Правили граф и хотите увезти это в repo сразу —
# workflow_dispatch, кнопкой.
name: Графы с прода + свод СНП 2.0 → факт

on:
  schedule:
    - cron: "10 2 * * *"    # 07:10 Астана
    - cron: "10 14 * * *"   # 19:10 Астана
  workflow_dispatch:        # и вручную: правили граф или свод только что
  push:
    # Ручной коммит в regions/ (новая область через scripts/new_region.py,
    # переномерация id) — тоже причина пересобрать факт немедленно, а не ждать
    # полсуток. Зацикливания нет: пуш от GITHUB_TOKEN не триггерит workflow.
    paths:
      - "regions/**"

# Пишем в репозиторий, поэтому нужен доступ на запись; параллельные запуски
# запрещены, иначе два коммита в один файл разъедутся.
permissions:
  contents: write
concurrency:
  group: smr2-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Поставить зависимости разбора
        # openpyxl нужен только этой джобе: сервер книгу не читает, он отдаёт
        # уже разложенный smr2/*.json. Экспорту графов зависимости не нужны
        # вовсе — он на urllib из стандартной библиотеки.
        run: pip install openpyxl

      - name: Забрать графы с прода (источник правды — фронт)
        id: export
        # Не роняем джобу: вьюер может быть недоступен (деплой, сон) — тогда
        # зеркало остаётся прежним, и факт пересчитается по нему же. Красный
        # код скрипт возвращает только когда прод отдал что-то, чему нельзя
        # верить (не прошло схему, граф усох) — такую область он не пишет,
        # а мы сообщаем об этом последним шагом.
        continue-on-error: true
        env:
          # Repo variable, если вьюер переедет; иначе — боевой адрес из кода.
          GRAPHVIS_URL: ${{ vars.GRAPHVIS_URL }}
        run: python scripts/export_regions.py

      - name: Пересобрать факт по всем областям и сверить с графами
        id: build
        # Прогон заканчивается прямой сверкой по всем записям: не ссылается ли
        # раскладка на удалённые рёбра и не пропало ли что-то с карты. Не
        # сошлось — шаг падает (файлы всё равно уже собраны и будут закоммичены
        # следующим шагом).
        run: python scripts/import_smr2.py --region all --from-sheet

      - name: Закоммитить обновление
        # Ставится даже если прошлый шаг упал: при развале одной области скрипт
        # возвращает ненулевой код, но остальные области он уже пересобрал —
        # их обновление терять незачем (см. suspicious() в скрипте).
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        run: |
          git config user.name  "smr2-sync"
          git config user.email "smr2-sync@users.noreply.github.com"
          git add regions smr2 SMR2_RECONCILE.md SVOD_ISSUES.md
          if git diff --cached --quiet; then
            echo "Ни графы, ни свод не изменились — коммитить нечего."
            exit 0
          fi
          # В сообщении видно, была ли в коммите правка графа: она приезжает с
          # прода и в истории репозитория больше ничем не подписана.
          graphs=$(git diff --cached --name-only -- regions | wc -l)
          if [ "$graphs" -gt 0 ]; then
            head="Графы с прода + факт СМР на $(date -u '+%Y-%m-%d %H:%M UTC')"
          else
            head="Факт СМР из свода СНП 2.0 на $(date -u '+%Y-%m-%d %H:%M UTC')"
          fi
          git commit -m "$head"
          git push

      - name: Проверить, всё ли прошло чисто
        # Отдельным шагом в конце: сначала сохранить то, что собралось, и лишь
        # потом покраснеть — иначе неудача одной области прячет свежие данные
        # остальных.
        if: steps.build.outcome == 'failure' || steps.export.outcome == 'failure'
        run: |
          if [ "${{ steps.export.outcome }}" = "failure" ]; then
            echo "::error::Графы с прода забраны не полностью — смотрите лог шага экспорта."
          fi
          if [ "${{ steps.build.outcome }}" = "failure" ]; then
            echo "::error::Часть областей не обновилась — смотрите лог шага сборки."
          fi
          exit 1
